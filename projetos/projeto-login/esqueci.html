<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a senha</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <style>
        section#login {
                height: 440px;
            }

        @media screen and (min-width: 768px) and (max-width: 992px) {
            section#login {
                height: 210px;
            }
        }    

        @media screen and (min-width: 992px) {
            section#login {
                height: 225px;
            }
        }
    </style>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem"></div>
            <div id="form">
                <h1>Escolha sua nova senha!</h1>
        
                <form id="form-senha" action="login.php" method="post">
                    <div class="campo">
                    <i class="material-icons">lock</i>
                    <input type="password" name="senha" id="senha1" placeholder=" Nova senha" autocomplete="new-password" required minlength="8">
                    <label for="senha1">Senha</label>
                    </div>
                    <div class="campo">
                    <i class="material-icons">lock_reset</i>
                    <input type="password" name="senha2" id="senha2" placeholder=" Repita a senha" autocomplete="new-password" required minlength="8">
                    <label for="senha2">Senha</label>
                    </div>
                    <input class="entrar" type="submit" value="Mudar a senha">
                </form>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById('form-senha');
        form.addEventListener('submit', function(event) {
        event.preventDefault();

        const senha1 = document.getElementById('senha1').value;
        const senha2 = document.getElementById('senha2').value;

        if (senha1.length < 8) {
            alert("A senha deve ter pelo menos 8 caracteres.");
            return;
        }

        if (senha1 !== senha2) {
            alert("As senhas não coincidem.");
            return;
        }

        window.location.href = "index.html";
        });
    </script>
</body>
</body>
</html>
