<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
            </div>
            <div id="form">
                <h1>Log in</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente</p>
                <form action="login.php" method="post">
                    <div class="campo">
                        <i class="material-icons">lock_person</i>
                        <input type="email" name="login" id="ilogin" placeholder=" Seu e-mail" autocomplete="email" required maxlength="30">
                        <label for="ilogin">Login</label> 
                    </div>
                    <div class="campo">
                        <i class="material-icons">lock</i>
                        <input type="password" name="senha" id="isenha" placeholder=" Sua senha" autocomplete="current-password" required minlength="8">
                        <label for="isenha">Senha</label>
                    </div>
                    
                    <input class="entrar" type="submit" value="Entrar">
                    <button id="esqueci" onclick="window.location.href='esqueci.html'">Esqueci a minha senha</button>
                    
                    <p id="cadastro">Não tenho conta, <a href="cadastro.html"> me cadastrar</a></p>
                </form>
            </div>
        </section>
    </main>
    <script>
        
    </script>
</body>
</html>
