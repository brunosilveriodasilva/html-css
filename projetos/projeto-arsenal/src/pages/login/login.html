<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/reset.css"/>
    <link rel="stylesheet" href="./../styles/global.css">
    <link rel="stylesheet" href="style.css">
    <title>Name - Login</title>
</head>
<body>
    <div class="back-to-home">
        <a href="../../../index.html" class="back">
            <img src="../../assets/img/seta-esquerda.png" alt="Seta">
            <h1>Voltar para o Home</h1>
        </a>
    </div>

    <main>
        <div class="main-content">
            <div class="login-container">
                <div class="title">
                    <h1>Login no <strong>Name</strong></h1>
                </div>
                <div class="login">
                    <div class="inputs">
                        <div class="email">
                            <label for="email">EMAIL</label>
                            <input type="email" name="emaili" id="email">
                        </div>
                        <div class="pass">
                            <label for="pass">SENHA</label>
                            <input type="password" name="passi" id="pass">
                        </div>
                    </div>
                    <div class="btns">
                        <button class="continue">Continue</button>
                        <button class="clear">Limpar Dados</button>
                    </div>
                </div>
            </div>    
                <div class="terms">
                    <nav>
                        <ul>
                            <li>Login</li>
                            <li class="circle">Terms</li>
                            <li class="circle">Privacy</li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
    
</body>
</html>
