<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/formulario-de-contato.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/media-query.css">
    <title>Formulario</title>
</head>
<body>
    <main class="container">
        <div class="cont-sec">
            <div class="logo">
                <h1>Fomulario</h1>
                <img src="img/seta-direita.png" alt="">
            </div>
            <div class="container-img">

            </div>
        </div>

        <div class="cont-form">
            <form method="post">

                <div class="title">
                    <h1>Log in</h1>
                </div>
                
                <div class="items-form">
                    <div class="item-form">
                        <label for="name">Nome:</label>
                        <input type="text" name="name" id="name">
                    </div>
                    <div class="item-form">
                        <label for="sobre">Sobrenome:</label>
                        <input type="text" name="sobre" id="sobre">
                    </div>
                    
                    <div class="item-form">
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email">
                    </div>
                </div>

                <div class="button-sub">
                    <input type="submit" value="Enviar" src="#">
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>
            <span class="label">Site desenvilvido por:</span> 
            <span class="name"><i>Bruno Silverio da Silva</i></span>
        </p>
    </footer>
</body>
</html>
