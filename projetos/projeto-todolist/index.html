<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/media-query.css">
    <title>To List</title>
</head>
<body>
    <div class="tolist-container">
        <div class="add-items">
            <input type="text" name="input" id="input" placeholder="O que tenho que fazer?...">
            <button class="add">Adicionar</button>
        </div>
        <ul class="list">
            <li class="items-list">
                <div class="box-img-correct">
                    <img src="img/correto.png" alt="check-tarefa" id="img-correct">
                </div>
                <div class="text">
                    <p>lorem</p>
                </div>
                <div class="box-img-delete">
                    <img src="img/deletar.png" alt="check-deletar" id="img-delete">
                </div>
            </li>
        </ul>
    </div>

    
    
</body>
</html>
