<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        .campo {
            position: relative;
            margin-top: 1.5rem;
        }
        
        input {
            position: relative;
            width: 100%;
            padding: 8px;
            font-size: 1rem;
            border: 2px solid black;
            border-radius: 10px;
            outline: none;
            transition: border 0.3s ease;
        }
        
        label {
            position: absolute;
            left: 10px;
            color: #777;
            transition: 0.3s;
            pointer-events: none; 
        }
        
        input:placeholder-shown + label {
            top: 10px;
            font-size: 1rem;
            color: #777;
        }
        
        input:not(:placeholder-shown) + label {
            font-size: 0.8rem;
            color: #007bff;
            top: -17px;
        }

        input:focus {
            border: 2px solid blue;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="campo">
        <input type="text" placeholder=" " id="nome">
        <label for="nome">Nome completo</label>
    </div>
</body>
</html>
