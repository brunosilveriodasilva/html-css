<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Notas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        #principal {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            margin: auto;
        }

        th {
            font-size: 1.2em;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }
        
        .backgray {
            color: white;
            background-color: rgb(119, 119, 119);
        }

        th.backgray {
            text-shadow:
            -0.5px -0.5px 0 black,
            0.5px -0.5px 0 black,
            -1px 1px 0 black,
            1px 1px 0 black;
        }

        th#left {
            text-align: left;
        }

        td#materia {
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <h1 id="principal">Tabela de Notas</h1>
    <table>
        <thead>
            <tr>
                <th scope="col" class="backgray" rowspan="2">Área</th>
                <th scope="col" class="backgray" rowspan="2">Disciplinas</th>
                <th scope="colgroup"class="backgray" colspan="2">Notas</th>
                <th scope="col" class="backgray" rowspan="2">Média</th>
            </tr>
            <tr>
                <th scope="col" class="backgray">Nota 1</th>
                <th scope="col" class="backgray">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4">Exatas</th>
                <td id="materia">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td id="materia">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td id="materia">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td id="materia">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="row" id="left" class="backgray" colspan="4">Medias de Exatas</th>
                <td class="backgray">0.0</td>
            </tr>
            <tr>
                <th scope-="rowgroup" rowspan="2">Humanas</th>
                <td id="materia">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td id="materia">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="row" id="left" class="backgray" colspan="4">Medias de Humanas</th>
                <td class="backgray">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
