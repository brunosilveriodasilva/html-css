<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: rgb(248, 140, 68);
            height: 100px;

            display: flex;
            flex-flow: column wrap;
        }

        div.iten {
            background-color: rgb(16, 159, 255);
            text-align: center;
            border: 1px solid black;
            padding: 10px;

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="iten">Exemplo de bloco A</div>
        <div class="iten">Exemplo de bloco B</div>
        <div class="iten">Exemplo de bloco C</div>
        <div class="iten">Exemplo de bloco D</div>
        <div class="iten">Exemplo de bloco E</div>
        <div class="iten">Exemplo de bloco F</div>
        <div class="iten">Exemplo de bloco G</div>
        <div class="iten">Exemplo de bloco H</div>              
    </div>
    
    
</body>
</html>
