<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="vice-nitial-scale=1.0">
    <title>Items Flexbox</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        div.conteiner {
            background-color: rgb(187, 187, 187);
            margin: 20px;
            width: 300px;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
            flex-shrink: 0;
            flex-grow: 1;
        }           
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
