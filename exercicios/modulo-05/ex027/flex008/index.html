<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="vice-nitial-scale=1.0">
    <title>Items Flexbox</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        div.conteiner {
            background-color: rgb(187, 187, 187);
            margin: 20px;
            box-sizing: border-box;

            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: aqua;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">Conteúdo maior, que vai ocupar mais espaço ainda</div>
        <div class="item">F</div>
        <div class="item">Conteúdo maior ainda</div>
    </div>
    

    
</body>
</html>
