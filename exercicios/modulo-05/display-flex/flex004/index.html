<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: rgb(164, 240, 250);
            height: 300px;

            display: flex;
            flex-flow: row nowrap;
            justify-content: space-evenly;
            align-items: flex-start;
        }

        div.iten {
            background-color: rgb(16, 52, 255);
            text-align: center;
            border: 1px solid black;
            padding: 10px;


        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="iten">A</div>
        <div class="iten">B</div>
        <div class="iten">C</div>
        <div class="iten">D</div>
        <div class="iten">E</div>
        <div class="iten">F</div>
        <div class="iten">G</div>
        <div class="iten">H</div>              
    </div>
    
</body>
</html>
