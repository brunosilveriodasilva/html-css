<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Nomes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        #principal {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            margin: auto;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }    
    </style>
</head>
<body>
    <h1 id="principal">Tabelas</h1>
    <table>
        <caption>
            Filmes Favoritos
        </caption>
        <thead>
            <tr>
                <th scope="col">Grupo</th>
                <th scope="col">Nomes</th>
                <th colspan="3" socop="colgrup">Filmes</th>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <th colspan="4" scope="row">Total</th>
                <td>1000</td>
            </tr>
        </tfoot>
        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">Mulheres</th>
                <td>Ana Silva</td>
                <td>Rambo</td>
                <td>Aliem</td>
                <td>Vigadores</td>
            </tr>
            <tr>
                <td>Beatriz Souza</td>
                <td>Aliem</td>
                <td>Vigadores</td>
                <td>Rambo</td>
            </tr>
            <tr>
                <td>Claudia Silva</td>
                <td>Aliem</td>
                <td>Vigadores</td>
                <td>Rambo</td>
            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup">Homens</th>
                <td>Bruno Silva</td>
                <td>Aliem</td>
                <td>Vigadores</td>
                <td>Rambo</td>
            </tr>
            <tr>
                <td>Daniel Silva</td>
                <td>Aliem</td>
                <td>Vigadores</td>
                <td>Rambo</td>
            </tr>
            <tr>
                <td>Jóse Cunha</td>
                <td>Aliem</td>
                <td>Vigadores</td>
                <td>Rambo</td>
            </tr>

        </tbody>
        
    </table>
    
</body>
</html>
