<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="estilos/style.css">
    <style>
        /* declarações gerais */

        * {
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #233eff;
            background-size: contain;
        }

        h1 {
            color: white;
            text-shadow: 3px 3px 0px #0e1d8f;
            padding: 10px;
        }

        /* declaração de paisagem */

        @media screen and (orientation: portrait){

            body {
                background-image: url(..imagems/cev-portrait.jpg);
            }
            
        }

        /* declaração de retrato */

        @media screen and (orientation: landscape){

            body {
            background-image: url(..imagems/cev-landscape.jpg);
            }
        }
    </style>
</head>
<body>
    <h1 id="principal">Mude a orientação do seu dispositivo</h1>
</body>
</html>
