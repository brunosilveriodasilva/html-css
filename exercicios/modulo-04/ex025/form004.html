<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
    <style>
        body {
            background-color: cornsilk;
            font-family: Arial, Helvetica, sans-serif;
        }

        fieldset {
            background-color: white;
            border-width: 5px;
            border-color: black;
            padding: 5px;
        }

        legend {
            font-size: 1.3em;
            font-weight: bolder;
        }

        #principal {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 id="principal">Exemplo de formulário</h1>
    <form action="" method="get">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome">
            </p>
            <p>
                <label for="iemail">E-mail: </label>
                <input type="email" name="email" id="iemail" autocomplete="email">
            </p>
            <p>
                <label for="itel">Telefone: </label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" required min="10" pattern="^(\d{2}\)\d{4,5}-\d{4}$" required placeholder="(xx)xxxx-xxxx">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="  Enviar  ">
            <input type="reset" value="  Limpar  ">
        </p>
    </form>
</body>
</html>
