<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        #principal {
            text-align: center;
        }

        fieldset {
            border-width: 5px;
        }

        legend {
            font-size: 1.3em;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <h1 id="principal">Exemplo de Formulário</h1>

    <form action="" method="post" autocomplete="on">
        <p>
            <label for="iest">Estado: </label>
            <select name="est" id="iest">
                <option value="" selected>---Escolha---</option>
                <optgroup label="Região Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                </optgroup>
                    <optgroup label="Região Nordeste">
                        <option value="MA">Maranão</option>
                        <option value="PE">Pernambuco</option>
                        <option value="RN">Rio Grande Do Norte</option>
                    </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">Profissão: </label>
            <input type="text" name="prof" id="iprof" list="istprof">
            <datalist id="istprof">
                <option value="ADM">Adiministrador</option>
                <option value="CONT">Contador</option>
                <option value="DEV">Desenvovedor</option>
                <option>Professor</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem: </label> <br>
            <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Olá"></textarea>
        </p>

        <p>
            <input type="submit" value="  Enviar  ">
            <input type="reset" value="  Limpar  ">
        </p>
    </form>

    
</body>
</html>
